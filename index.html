<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chiara Tangari — Event Manager & Designer</title>
  <meta name="description" content="Portfolio di Chiara Tangari, event manager e designer: eventi e progetti grafici.">
  <meta property="og:title" content="Chiara Tangari — Event Manager & Designer">
  <meta property="og:description" content="Portfolio di Chiara Tangari, event manager e designer: eventi e progetti grafici.">
  <script>document.documentElement.classList.add('js')</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">

  <div class="curtain" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><span class="curtain-label">Chiara Tangari</span></div>

  <header class="site-header">
    <a class="logo" href="index.html"><span data-c="generale.nome">Chiara</span> <span data-c="generale.cognome">Tangari</span><span class="dot"></span></a>
    <button class="nav-toggle" aria-label="Apri il menu" aria-expanded="false"><span></span><span></span></button>
    <nav class="nav" aria-label="Menu principale">
      <a href="index.html" data-nav="home">Home</a>
      <a href="chi-sono.html" data-nav="chi-sono">Chi sono</a>
      <a href="lavori.html" data-nav="lavori">Lavori</a>
      <a href="contatti.html" data-nav="contatti">Contatti</a>
    </nav>
  </header>

  <!-- I testi e le foto si modificano dall'area admin (file in /content), non qui. -->
  <main id="main">

    <section class="hero">
      <canvas class="scene3d" data-scene="home" aria-hidden="true"></canvas>
      <div class="hero-inner container">
        <p class="eyebrow" data-c="home.eyebrow">Event Manager &amp; Designer</p>
        <h1 class="hero-title" data-fit>
          <span class="line" data-c="generale.nome" data-split>Chiara</span>
          <span class="line outline" data-c="generale.cognome" data-split>Tangari</span>
        </h1>
      </div>
      <div class="scroll-cue" aria-hidden="true"><span></span>Scorri</div>
    </section>

    <div class="marquee" aria-hidden="true"><div class="marquee-track" data-list="nastro"></div></div>

    <section class="section intro-section">
      <div class="container intro">
        <p class="eyebrow reveal">Chi sono</p>
        <p class="intro-text" data-c="home.presentazione" data-words></p>
        <a class="link-arrow reveal" href="chi-sono.html">La mia storia <span>→</span></a>
      </div>
    </section>

    <section class="section section-alt">
      <div class="container">
        <div class="section-head reveal">
          <div>
            <p class="eyebrow">Esplora</p>
            <h2 data-words>Cosa vuoi vedere?</h2>
          </div>
        </div>
        <div class="doors">
          <a class="door door-grafica reveal" href="lavori.html#grafica" data-tilt data-cursor="Guarda">
            <span class="door-arrow">↗</span>
            <span class="door-body"><strong>Grafica</strong><span data-c="home.porta_grafica"></span></span>
          </a>
          <a class="door door-eventi reveal" href="lavori.html#eventi" data-tilt data-cursor="Guarda">
            <span class="door-arrow">↗</span>
            <span class="door-body"><strong>Eventi</strong><span data-c="home.porta_eventi"></span></span>
          </a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-row container">
      <p>© <span class="year">2026</span> <span data-c="generale.nome">Chiara</span> <span data-c="generale.cognome">Tangari</span></p>
      <a href="#" class="to-top">Torna su ↑</a>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/scene3d.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
